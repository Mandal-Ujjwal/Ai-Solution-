<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Photo Gallery | AI-Solutions</title>
<meta name="description" content="Photos from AI-Solutions events, workshops and team collaboration.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-nav"></div>
<section class="section" style="padding-top:140px">
  <div class="container">
    <div class="section-title" data-aos="fade-up"><h2>Photo Gallery</h2><p>Moments from our events, workshops and team life.</p></div>
    <div class="gallery-actions d-flex flex-wrap gap-2 align-items-center mb-4" data-aos="fade-up">
      <div class="btn-group gallery-filter" role="group" aria-label="Gallery filter">
        <button class="btn btn-ghost btn-sm active" type="button" data-gallery-filter="all">All</button>
        <button class="btn btn-ghost btn-sm" type="button" data-gallery-filter="promotional">Promotional Events</button>
        <button class="btn btn-ghost btn-sm" type="button" data-gallery-filter="upcoming">Upcoming Events</button>
      </div>
      <div class="ms-auto d-flex align-items-center gap-2">
        <label class="form-label mb-0" for="gallery-sort">Sort:</label>
        <select id="gallery-sort" class="form-select form-select-sm">
          <option value="default">Default order</option>
          <option value="promotional-first">Promotional first</option>
          <option value="upcoming-first">Upcoming first</option>
          <option value="date-desc">Newest date</option>
          <option value="date-asc">Oldest date</option>
        </select>
      </div>
    </div>
    <div class="gallery-grid">
      <div class="gallery-item" data-category="promotional" data-date="2026-06-10" data-event="AI Product Launch" data-aos="zoom-in">
        <img src="https://picsum.photos/seed/aisol1/600/400" alt="Promotional event photo 1" loading="lazy">
      </div>
      <div class="gallery-item" data-category="upcoming" data-date="2026-08-05" data-event="Innovation Summit" data-aos="zoom-in">
        <img src="https://picsum.photos/seed/aisol2/600/520" alt="Upcoming event photo 2" loading="lazy">
      </div>
      <div class="gallery-item" data-category="promotional" data-date="2026-07-20" data-event="Summer Campaign" data-aos="zoom-in">
        <img src="https://picsum.photos/seed/aisol3/600/640" alt="Promotional event photo 3" loading="lazy">
      </div>
      <div class="gallery-item" data-category="upcoming" data-date="2026-09-15" data-event="Technology Workshop" data-aos="zoom-in">
        <img src="https://picsum.photos/seed/aisol4/600/400" alt="Upcoming event photo 4" loading="lazy">
      </div>
      <div class="gallery-item" data-category="other" data-date="2026-04-01" data-event="Team Retreat" data-aos="zoom-in">
        <img src="https://picsum.photos/seed/aisol5/600/520" alt="Team event photo 5" loading="lazy">
      </div>
      <div class="gallery-item" data-category="promotional" data-date="2026-06-25" data-event="Launch Promo" data-aos="zoom-in">
        <img src="https://picsum.photos/seed/aisol6/600/640" alt="Promotional event photo 6" loading="lazy">
      </div>
      <div class="gallery-item" data-category="upcoming" data-date="2026-08-30" data-event="Customer Showcase" data-aos="zoom-in">
        <img src="https://picsum.photos/seed/aisol7/600/400" alt="Upcoming event photo 7" loading="lazy">
      </div>
      <div class="gallery-item" data-category="other" data-date="2026-03-18" data-event="Office Culture" data-aos="zoom-in">
        <img src="https://picsum.photos/seed/aisol8/600/520" alt="Office life photo 8" loading="lazy">
      </div>
      <div class="gallery-item" data-category="promotional" data-date="2026-05-22" data-event="Roadshow" data-aos="zoom-in">
        <img src="https://picsum.photos/seed/aisol9/600/640" alt="Promotional event photo 9" loading="lazy">
      </div>
      <div class="gallery-item" data-category="upcoming" data-date="2026-10-10" data-event="AI Roundtable" data-aos="zoom-in">
        <img src="https://picsum.photos/seed/aisol10/600/400" alt="Upcoming event photo 10" loading="lazy">
      </div>
      <div class="gallery-item" data-category="other" data-date="2026-02-28" data-event="Planning Session" data-aos="zoom-in">
        <img src="https://picsum.photos/seed/aisol11/600/520" alt="Office event photo 11" loading="lazy">
      </div>
      <div class="gallery-item" data-category="promotional" data-date="2026-07-05" data-event="Campaign Preview" data-aos="zoom-in">
        <img src="https://picsum.photos/seed/aisol12/600/640" alt="Promotional event photo 12" loading="lazy">
      </div>
    </div>
  </div>
</section>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/typed.js@2.1.0/dist/typed.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.8.1/dist/vanilla-tilt.min.js"></script>
<script>if(typeof gsap!=='undefined'&&typeof ScrollTrigger!=='undefined')gsap.registerPlugin(ScrollTrigger);</script>
<script src="js/partials.js"></script>
<script src="js/main.js"></script>
</body>
</html>
